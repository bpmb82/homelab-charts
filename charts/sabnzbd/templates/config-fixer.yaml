apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sabnzbd.fullname" . }}-config-fixer
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: ini-updater
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache sed
          INI_FILE="/config/sabnzbd.ini"
          if [ -f "$INI_FILE" ]; then
            sed -i 's/^host_whitelist.*/host_whitelist = localhost, 127.0.0.1, {{ .Values.trustedDomain }}/' "$INI_FILE"
            echo "Host whitelist successfully updated!"
          else
            echo "INI file not found yet, skipping."
          fi
        {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}