apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sabnzbd.fullname" . }}-config-fixer
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: {{ include "sabnzbd.fullname" . }}-trigger-sa
      restartPolicy: OnFailure
      containers:
      - name: updater
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          INI_FILE="/config/sabnzbd.ini"
          if [ -f "$INI_FILE" ]; then
            sed -i 's/^host_whitelist.*/host_whitelist = localhost, 127.0.0.1, {{ .Values.trustedDomain }}/' "$INI_FILE"
            echo "INI file updated successfully."
          fi

          TIMESTAMP=$(date +%s)
          echo "Updating trigger configmap with timestamp: $TIMESTAMP"
          kubectl patch configmap {{ include "sabnzbd.fullname" . }}-trigger-cm --type=merge -p "{\"data\":{\"last-updated\":\"$TIMESTAMP\"}}"
        {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}