apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sabnzbd.fullname" . }}-trigger-job
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    #"helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: {{ include "sabnzbd.fullname" . }}-trigger-sa
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
      - name: updater
        image: bitnami/kubectl:latest
      command:
        - /bin/sh
        - -c
        - |
          INI_FILE="/config/sabnzbd.ini"
          COUNTER=0
          MAX_RETRIES=30
          
          while [ ! -f "$INI_FILE" ]; do
            COUNTER=$((COUNTER + 1))
            if [ "$COUNTER" -ge "$MAX_RETRIES" ]; then
              echo "Error: Timeout reached. $INI_FILE is not available after $((MAX_RETRIES * 2)) seconds."
              exit 1
            fi
            echo "Waiting for configuration file (attempt $COUNTER/$MAX_RETRIES)..."
            sleep 2
          done

          sed -i 's/^host_whitelist.*/host_whitelist = localhost, 127.0.0.1, {{ .Values.trustedDomain }}/' "$INI_FILE"
          EXITCODE=$?
          
          if [ "$EXITCODE" -ne 0 ]; then
            echo "Error: sed failed with exit code $EXITCODE."
            exit $EXITCODE
          fi
          
          echo "INI file updated successfully."
          sleep 3

          TIMESTAMP=$(date +%s)
          echo "Triggering deployment restart via timestamp: $TIMESTAMP"
          
          kubectl patch deployment {{ include "sabnzbd.fullname" . }} --type=strategic -p \
            "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"config-restarted-at\":\"$TIMESTAMP\"}}}}}"
            
          PATCH_EXIT=$?
          if [ "$PATCH_EXIT" -ne 0 ]; then
            echo "Error: Failed to patch deployment."
            exit $PATCH_EXIT
          fi
          
          echo "Deployment patched and restart triggered successfully."
        volumeMounts:
        {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}