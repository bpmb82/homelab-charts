apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sabnzbd.fullname" . }}-trigger-job
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    #"helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: {{ include "sabnzbd.fullname" . }}-trigger-sa
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
      - name: updater
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          INI_FILE="/config/sabnzbd.ini"
          if [ -f "$INI_FILE" ]; then
            sed -i 's/^host_whitelist.*/host_whitelist = localhost, 127.0.0.1, {{ .Values.trustedDomain }}/' "$INI_FILE"
            
            EXITCODE=$?

            if [ "$EXITCODE" == "0" ]; then
              echo "INI file updated successfully."
            else
              echo "Error running sed on sabnzbd.ini: $EXITCODE"
              exit $EXITCODE
            fi
          fi

          echo "Waiting for storage to settle..."
          sleep 5

          TIMESTAMP=$(date +%s)
          echo "Triggering deployment restart via timestamp: $TIMESTAMP"
          kubectl patch deployment {{ include "sabnzbd.fullname" . }} --type=strategic -p \
            "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"config-restarted-at\":\"$TIMESTAMP\"}}}}}"
        volumeMounts:
        {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}